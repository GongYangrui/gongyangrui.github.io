media:
  input: public/media
  output: /media

settings:
  content:
    merge: true
  hide: false

content:
  - name: profile
    label: Profile
    type: file
    path: src/data/profile.json
    format: json
    list: true
    fields:
      - { name: id, label: Stable ID, type: string, hidden: true, default: profile }
      - { name: name, label: Name, type: string, required: true }
      - name: headline
        label: Headline
        type: object
        fields:
          - { name: en, label: English, type: string, required: true }
          - { name: zh, label: 中文, type: string, required: true }
      - name: intro
        label: Introduction
        type: object
        fields:
          - { name: en, label: English, type: text, required: true }
          - { name: zh, label: 中文, type: text, required: true }
      - { name: email, label: Email, type: string, required: true }
      - { name: github, label: GitHub URL, type: string, required: true }
      - { name: linkedin, label: LinkedIn URL, type: string }

  - name: homepage
    label: Homepage
    type: file
    path: src/data/home.json
    format: json
    list: true
    fields:
      - { name: id, label: Stable ID, type: string, hidden: true, default: home }
      - name: experience
        label: Experience module
        type: object
        fields:
          - { name: enabled, label: Show module, type: boolean, default: true }
          - { name: itemIds, label: Item IDs in display order, type: string, list: true }
      - name: projects
        label: Projects module
        type: object
        fields:
          - { name: enabled, label: Show module, type: boolean, default: false }
          - { name: itemIds, label: Item IDs in display order, type: string, list: true }
      - name: writing
        label: Writing module
        type: object
        fields:
          - { name: enabled, label: Show module, type: boolean, default: true }
          - { name: itemIds, label: Translation keys in display order, type: string, list: true }

  - name: experience
    label: Experience
    type: file
    path: src/data/experience.json
    format: json
    list: true
    fields:
      - { name: id, label: Stable ID, type: string, required: true }
      - { name: order, label: Resume order, type: number, required: true }
      - { name: period, label: Date, type: string, required: true }
      - name: role
        label: Role
        type: object
        fields:
          - { name: en, label: English, type: string, required: true }
          - { name: zh, label: 中文, type: string, required: true }
      - name: organization
        label: Organization
        type: object
        fields:
          - { name: en, label: English, type: string, required: true }
          - { name: zh, label: 中文, type: string, required: true }
      - name: description
        label: Description
        type: object
        fields:
          - { name: en, label: English, type: text, required: true }
          - { name: zh, label: 中文, type: text, required: true }
      - name: category
        label: Category
        type: select
        options:
          values: [engineering, research]
      - { name: url, label: URL, type: string }

  - name: education
    label: Education
    type: file
    path: src/data/education.json
    format: json
    list: true
    fields:
      - { name: id, label: Stable ID, type: string, required: true }
      - { name: order, label: Resume order, type: number, required: true }
      - { name: period, label: Date, type: string, required: true }
      - name: institution
        label: Institution
        type: object
        fields:
          - { name: en, label: English, type: string, required: true }
          - { name: zh, label: 中文, type: string, required: true }
      - name: program
        label: Program
        type: object
        fields:
          - { name: en, label: English, type: string, required: true }
          - { name: zh, label: 中文, type: string, required: true }
      - { name: url, label: URL, type: string }

  - name: projects
    label: Projects
    type: file
    path: src/data/projects.json
    format: json
    list: true
    fields:
      - { name: id, label: Stable ID, type: string, required: true }
      - { name: name, label: Name, type: string, required: true }
      - name: summary
        label: Summary
        type: object
        fields:
          - { name: en, label: English, type: text, required: true }
          - { name: zh, label: 中文, type: text, required: true }
      - { name: technologies, label: Technologies, type: string, list: true }
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: object
            fields:
              - { name: en, label: English, type: string, required: true }
              - { name: zh, label: 中文, type: string, required: true }
          - { name: url, label: URL, type: string, required: true }

  - name: publications
    label: Publications
    type: file
    path: src/data/publications.json
    format: json
    list: true
    fields:
      - { name: id, label: Stable ID, type: string, required: true }
      - { name: order, label: Resume order, type: number, required: true }
      - { name: title, label: Title, type: string, required: true }
      - { name: authors, label: Authors, type: text, required: true }
      - { name: venue, label: Venue, type: string, required: true }
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: object
            fields:
              - { name: en, label: English, type: string, required: true }
              - { name: zh, label: 中文, type: string, required: true }
          - { name: url, label: URL, type: string, required: true }

  - name: honors
    label: Honors
    type: file
    path: src/data/honors.json
    format: json
    list: true
    fields:
      - { name: id, label: Stable ID, type: string, required: true }
      - { name: order, label: Resume order, type: number, required: true }
      - { name: date, label: Date, type: string, required: true }
      - name: title
        label: Title
        type: object
        fields:
          - { name: en, label: English, type: string, required: true }
          - { name: zh, label: 中文, type: string, required: true }

  - name: writing-en
    label: Writing · English
    type: collection
    path: src/content/writing/en
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, publishedAt, draft]
      primary: title
      sort: [publishedAt, title]
      default:
        sort: publishedAt
        order: desc
    fields: &writing_fields
      - { name: lang, label: Language, type: string, default: en, required: true }
      - { name: slug, label: URL slug, type: string, required: true }
      - { name: translationKey, label: Translation key, type: string, required: true }
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Summary, type: text, required: true }
      - { name: publishedAt, label: Published, type: date, required: true }
      - { name: updatedAt, label: Updated, type: date }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: draft, label: Draft, type: boolean, default: true }
      - { name: featured, label: Featured, type: boolean, default: false }
      - { name: body, label: Body, type: rich-text, required: true }

  - name: writing-zh
    label: Writing · 中文
    type: collection
    path: src/content/writing/zh
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, publishedAt, draft]
      primary: title
      sort: [publishedAt, title]
      default:
        sort: publishedAt
        order: desc
    fields:
      - { name: lang, label: Language, type: string, default: zh, required: true }
      - { name: slug, label: URL slug, type: string, required: true }
      - { name: translationKey, label: Translation key, type: string, required: true }
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Summary, type: text, required: true }
      - { name: publishedAt, label: Published, type: date, required: true }
      - { name: updatedAt, label: Updated, type: date }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: draft, label: Draft, type: boolean, default: true }
      - { name: featured, label: Featured, type: boolean, default: false }
      - { name: body, label: Body, type: rich-text, required: true }
